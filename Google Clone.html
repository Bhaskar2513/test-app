<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Clone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
        }

        header a {
            margin-right: 15px;
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        header a:hover {
            text-decoration: underline;
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 270px;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 560px;
            height: 45px;
            border-radius: 25px;
            border: 1px solid #dcdcdc;
            padding: 0 20px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }

        .buttons {
            margin-top: 25px;
        }

        .buttons button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            background-color: #f8f9fa;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
        }

        .buttons button:hover {
            border: 1px solid #dadce0;
        }

        /* Footer */
        footer {
            background-color: #f2f2f2;
            padding: 15px 20px;
            font-size: 14px;
            color: #70757a;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .footer-links a {
            margin-right: 15px;
            text-decoration: none;
            color: #70757a;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .search-box input {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
    </header>

    <!-- Main Section -->
    <main>
        <img 
            src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" 
            alt="Google Logo" 
            class="logo"
        >

        <div class="search-box">
            <input type="text" placeholder="Search Google or type a URL">
        </div>

        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>India</p>
        <div class="footer-links">
            <div>
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
            </div>
            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
