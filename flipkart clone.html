<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Clone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f1f3f6;
        }

        /* Navbar */
        header {
            background-color: #2874f0;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .search-box {
            width: 40%;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 2px;
            border: none;
            outline: none;
        }

        .nav-links button {
            background-color: white;
            color: #2874f0;
            border: none;
            padding: 6px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
        }

        .nav-links span {
            color: white;
            margin-left: 20px;
            cursor: pointer;
        }

        /* Categories */
        .categories {
            background-color: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .category {
            text-align: center;
            font-size: 14px;
            cursor: pointer;
        }

        .category img {
            width: 60px;
            margin-bottom: 5px;
        }

        /* Banner */
        .banner {
            width: 95%;
            margin: auto;
            margin-bottom: 20px;
        }

        .banner img {
            width: 100%;
            border-radius: 4px;
        }

        /* Products */
        .products {
            width: 95%;
            margin: auto;
            background-color: white;
            padding: 20px;
        }

        .products h2 {
            margin-bottom: 15px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .product h4 {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .product p {
            color: green;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background-color: #172337;
            color: white;
            padding: 30px;
            margin-top: 30px;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .footer-links div p {
            margin-bottom: 8px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-box {
                width: 60%;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header>
        <div class="logo">Flipkart</div>

        <div class="search-box">
            <input type="text" placeholder="Search for products, brands and more">
        </div>

        <div class="nav-links">
            <button>Login</button>
            <span>Cart</span>
        </div>
    </header>

    <!-- Categories -->
    <div class="categories">
        <div class="category">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/29327f40e9c4d26b.png">
            <p>Grocery</p>
        </div>
        <div class="category">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/22fddf3c7da4c4f4.png">
            <p>Mobiles</p>
        </div>
        <div class="category">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/0d75b34f7d8fbcb3.png">
            <p>Fashion</p>
        </div>
        <div class="category">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/69c6589653afdb9a.png">
            <p>Electronics</p>
        </div>
    </div>

    <!-- Banner -->
    <div class="banner">
        <img src="https://rukminim2.flixcart.com/fk-p-flap/1688/280/image/5f2ef87dc7d55c99.jpg">
    </div>

    <!-- Products -->
    <div class="products">
        <h2>Best Deals</h2>

        <div class="product-grid">
            <div class="product">
                <img src="https://rukminim2.flixcart.com/image/416/416/xif0q/mobile/5/r/x/-original-imaghx9qkugtbfrn.jpeg">
                <h4>Smartphone</h4>
                <p>₹12,999</p>
            </div>

            <div class="product">
                <img src="https://rukminim2.flixcart.com/image/416/416/xif0q/laptop/o/s/g/-original-imagp7pfshk6fzyy.jpeg">
                <h4>Laptop</h4>
                <p>₹54,999</p>
            </div>

            <div class="product">
                <img src="https://rukminim2.flixcart.com/image/416/416/xif0q/shoe/q/x/j/-original-imaghvb8cbdn6n6j.jpeg">
                <h4>Shoes</h4>
                <p>₹1,499</p>
            </div>

            <div class="product">
                <img src="https://rukminim2.flixcart.com/image/416/416/xif0q/headphone/k/7/a/-original-imagp7pfchhg4c2z.jpeg">
                <h4>Headphones</h4>
                <p>₹2,299</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <div>
                <p>About Us</p>
                <p>Careers</p>
                <p>Press</p>
            </div>
            <div>
                <p>Help</p>
                <p>Payments</p>
                <p>Shipping</p>
            </div>
            <div>
                <p>Policy</p>
                <p>Privacy</p>
                <p>Terms</p>
            </div>
        </div>
    </footer>

</body>
</html>
